title: Security Cameras
views:
  - title: Control
    path: control
    icon: mdi:shield-home
    cards:
      - type: markdown
        title: Local alarm controller
        content: >-
          {% set alarm = states('sensor.security_camera_alarm_mode') %}
          {% set control = state_attr('sensor.security_camera_alarm_mode', 'control') %}
          {% set presence = state_attr('sensor.security_camera_alarm_mode', 'presence') %}
          {% set paused = state_attr('sensor.security_camera_alarm_mode', 'notifications_paused') %}
          # {% if alarm == 'armed_away' %}🛡️ Armed away
          {% elif alarm == 'armed_home' %}🌙 Armed at home
          {% elif alarm == 'disarmed' %}🔓 Disarmed
          {% else %}❔ Unavailable{% endif %}

          **Authority:** local Python controller<br>
          **Control:** {{ control | default('unknown', true) }}<br>
          **Phone presence:** {{ presence | default('unavailable', true) }}<br>
          **Detection alerts:** {{ 'paused' if paused else 'active' }}

      - type: grid
        title: Operator controls
        columns: 2
        square: false
        cards:
          - type: button
            entity: button.security_camera_automatic
            name: Automatic
            icon: mdi:shield-sync
            tap_action: {action: toggle}
          - type: button
            entity: button.security_camera_disarm
            name: Disarm
            icon: mdi:shield-off-outline
            tap_action: {action: toggle}
            confirmation: {text: "Disarm detection alerts?"}
          - type: button
            entity: button.security_camera_arm_at_home
            name: Arm at home
            icon: mdi:shield-home-outline
            tap_action: {action: toggle}
          - type: button
            entity: button.security_camera_arm_away
            name: Arm away
            icon: mdi:shield-lock-outline
            tap_action: {action: toggle}
          - type: button
            entity: button.security_camera_pause_alerts_1_hour
            name: Pause 1 hour
            icon: mdi:timer-pause
            tap_action: {action: toggle}
          - type: button
            entity: button.security_camera_resume_alerts
            name: Resume
            icon: mdi:bell-ring-outline
            tap_action: {action: toggle}
          - type: button
            entity: button.security_camera_acknowledge_incidents
            name: Acknowledge incidents
            icon: mdi:check-decagram
            tap_action: {action: toggle}

      - type: entities
        title: Presence and diagnostics
        show_header_toggle: false
        entities:
          - entity: sensor.security_camera_alarm_mode
            name: Local alarm mode
          - entity: binary_sensor.security_camera_phone_wifi_presence
            name: Phone Wi-Fi presence
          - entity: sensor.security_camera_control_mode
          - entity: sensor.security_camera_presence_state
          - entity: sensor.security_camera_active_incidents
          - entity: binary_sensor.security_camera_notifications_paused
          - entity: binary_sensor.sensor_de_presencia_humana_motion
            name: Interior human presence
          - entity: binary_sensor.security_camera_yellow_light_guard
            name: Yellow light guard

  - title: Cameras
    path: cameras
    icon: mdi:cctv
    cards:
      - type: picture-entity
        entity: camera.security_cam_garage
        name: Garage · last detection
        camera_view: auto
        show_state: true
      - type: picture-entity
        entity: camera.security_cam_backyard
        name: Backyard · last detection
        camera_view: auto
        show_state: true
      - type: entities
        title: Event streams
        show_header_toggle: false
        entities:
          - event.security_cam_garage_person
          - event.security_cam_backyard_person
          - event.security_camera_incident
